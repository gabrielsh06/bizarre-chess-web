<main class="game">
  <div class="game__container">
    <div class="game__lobby">
      <div class="game__create">
        <span class="game__label game__label--create">Create your game</span>
        <button (click)="createGame()" type="button" class="game__btn game__btn--create">
          Start a game
        </button>
      </div>
      <hr class="game__divider" />
      <div class="game__join">
        <label for="game-code" class="game__label game__label--join">Join a game</label>
        <div class="game__join-group">
          <input
            #codeInput
            type="text"
            id="game-code"
            name="code"
            class="game__input"
            placeholder="Enter code"
            autocomplete="off"
            (keyup.enter)="joinGame(codeInput.value)" />
          <button
            (click)="joinGame(codeInput.value)"
            type="button"
            class="game__btn game__btn--join">
            Join
          </button>
        </div>
      </div>
    </div>
    @if (gameCode()) {
      <div class="game__code-display">
        <span>
          Game Code:
          <strong>{{ gameCode() }}</strong>
        </span>
      </div>
    }
    <app-board [board]="board()" (move)="onMovePiece($event)" />
  </div>
</main>
