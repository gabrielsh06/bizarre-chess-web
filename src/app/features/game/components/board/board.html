<div class="board" [style.--board-columns]="board().columns">
  @for (square of squares(); track square.id) {
    <div
      class="board__square"
      [class.board__square--has-piece]="square.piece"
      [class.board__square--black]="square.color === 'BLACK'"
      [class.board__square--white]="square.color === 'WHITE'"
      [class.board__square--selected]="selectedSquare()?.id === square.id"
      (click)="selectSquare(square)">

      @if (square.column === 0) {
        <span class="board__coordinate board__coordinate--rank">
          {{ board().rows - square.row }}
        </span>
      }


      @if (square.piece) {
        <span
          class="board__piece"
          [class.board__piece--white]="square.piece.color === 'WHITE'"
          [class.board__piece--black]="square.piece.color === 'BLACK'">
          {{ square.piece.type | pieceIcon }}
        </span>
      }

      @if (square.row === board().rows - 1) {
        <span class="board__coordinate board__coordinate--file">
          {{ getFileLabel(square.column) }}
        </span>
      }
    </div>
  }
</div>
